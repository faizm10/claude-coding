<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Todos</title>
  <style>
    body { font: 18px/1.5 system-ui, sans-serif; background: #f6f3ee; display: grid; place-items: start center; padding-top: 60px; margin: 0; }
    main { background: #fff; width: 460px; border-radius: 14px; box-shadow: 0 8px 30px #0001; padding: 28px; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; font: inherit; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; }
    button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: #6d4aff; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 16px 0; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
    li.done span { text-decoration: line-through; color: #999; }
    footer { display: flex; justify-content: space-between; align-items: center; color: #555; }
    #clear { background: #eee; color: #333; }
  </style>
</head>
<body>
  <main>
    <h1>Todos</h1>
    <form id="form"><input id="new" type="text" placeholder="What needs doing?" aria-label="New todo"><button>Add</button></form>
    <ul id="list"></ul>
    <footer><span id="count"></span><button id="clear" type="button">Clear completed</button></footer>
  </main>
  <script type="module" src="/public/app.js"></script>
</body>
</html>
